name: Generate ConQU2027 Team Metrics

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate project metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ConQU2027
          filename: metrics.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          output_action: commit
          config_timezone: Asia/Shanghai

          template: classic
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 6
          plugin_languages_indepth: yes

          plugin_lines: yes

          plugin_habits: yes
          plugin_habits_from: 120
          plugin_habits_charts: yes
          plugin_habits_facts: yes

          plugin_contributors: yes
          plugin_contributors_head: main
          plugin_contributors_ignored: bot

          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes

          plugins_errors_fatal: no
          debug: no